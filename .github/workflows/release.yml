name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting and lint
        run: vp check
      - name: Check types
        run: vp run typecheck
      - name: Run unit and integration tests
        run: vp run test:unit
      - name: Replay real raw snapshots
        run: vp run test:live
      - name: Build package
        run: vp run build
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Version or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: vp run version
          publish-script: vp run release
          pr-title: 'chore(release): version package'
          commit-message: 'chore(release): version package'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Include version in release PR title
        if: steps.changesets.outputs.pr-number
        shell: bash
        run: |
          git fetch origin changeset-release/main
          package=$(git show origin/changeset-release/main:package.json)
          name=$(jq -r .name <<<"$package")
          version=$(jq -r .version <<<"$package")
          gh pr edit "$PR" --title "chore(release): $name@$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pr-number }}
